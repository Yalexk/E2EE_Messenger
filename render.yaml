# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repo. You'll be asked for MONGODB_URI
# (a free MongoDB Atlas cluster works).
services:
  - type: web
    name: x3dh-chat
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
